<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}CineMate{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f5f5f7; }
        .card-movie { height: 100%; transition: transform 0.2s; }
        .card-movie:hover { transform: scale(1.02); }
        .poster { height: 300px; object-fit: cover; }
        .star-rating { display: inline-flex; gap: 2px; cursor: pointer; font-size: 1.5rem; }
        .star-rating .star { color: #ccc; transition: color 0.2s; }
        .star-rating .star.active { color: #ffc107; }
        .star-rating .star:hover { color: #ffc107; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-camera-reels"></i> CineMate</a>
            <a class="btn btn-outline-light btn-sm me-2" href="/stats">Статистика</a>
            <div class="ms-auto">
                {% if user %}
                    <span class="text-light me-3">👋 {{ user.username }}</span>
                    <a class="btn btn-outline-light btn-sm me-2" href="/search">Поиск</a>
                    <a class="btn btn-outline-danger btn-sm" href="/logout">Выйти</a>
                {% else %}
                    <a class="btn btn-outline-light btn-sm me-2" href="/login">Войти</a>
                    <a class="btn btn-primary btn-sm" href="/register">Регистрация</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
